<script>
  // Set theme and language before first paint, so there is no flash.
  (function () {
    var d = document.documentElement, t = null, l = null;
    try { t = localStorage.getItem('dr-theme'); l = localStorage.getItem('dr-lang'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (l !== 'en' && l !== 'ro') l = /^ro\b/i.test(navigator.language || '') ? 'ro' : 'en';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
  })();
</script>

<style>
  :root {

    --surface-2: #232323;
    --border: #2f2f2f;
    --border-strong: #454545;

    --accent: #FFD905;

  :root[data-theme="light"] {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #efefeb;
    --border: #dcdcd6;
    --border-strong: #b9b9b2;
    --text: #111111;
    --muted: #595954;
    --accent: #FFD905;
    --on-accent: #111111;
    --accent-ink: #6b5a00;
    --focus: #111111;
    --chip: #ffffff;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font-ui);
    overflow-x: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .visually-hidden {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* Header and footer stay black in both themes, so the wordmark is always white and yellow. */
  .band { background: var(--brand-black); color: var(--brand-white); }
  .band :focus-visible { outline-color: var(--brand-yellow); }
  header.band { border-bottom: 1px solid #2a2a2a; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }

  }
  .band-btn:hover { border-color: var(--brand-yellow); }
  .band-btn svg { width: 18px; height: 18px; flex: none; }
  .icon-only { width: 38px; padding: 0; justify-content: center; }

    height: 40px; padding: 0 14px;
    background: var(--surface); color: var(--text);

  }
  .btn:hover { border-color: var(--border-strong); }
  .btn svg { width: 17px; height: 17px; flex: none; }

    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 999px;
    transition: background .15s;

  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;

  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .pane-head label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .pane-head .hint { font-size: 12px; color: var(--muted); }
  textarea {
    width: 100%; min-height: 340px; flex: 1; resize: vertical;
    padding: 14px 16px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 16px; line-height: 1.55;

  }
  textarea::placeholder { color: var(--muted); opacity: 0.8; }
  textarea:focus { border-color: var(--border-strong); }
  #output { background: var(--surface-2); }
  :root[data-theme="dark"] #output { border-color: #3a3500; }

  .stats { margin: 16px 0 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .dot { margin: 0 8px; opacity: 0.6; }
  .status { min-height: 1.5em; margin: 0 0 4px; font-size: 14px; color: var(--accent-ink); }

  .changes h2 { margin: 18px 0 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; font-size: 13px;
    background: var(--chip); border: 1px solid var(--border); border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .chip .from, .chip .to { font-family: var(--font-mono); font-weight: 600; }
  .chip .to { color: var(--accent-ink); }
  .chip .name { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--muted); }
  .chip .arrow, .chip .n { color: var(--muted); }
  .empty { margin: 0; font-size: 14px; color: var(--muted); }

  footer.band { padding: 22px 0; text-align: center; font-size: 14px; color: #cfcfcf; }
  footer .wordmark { font-size: 14px; }

  footer .small { font-size: 12px; color: #8f8f8f; }

  @media (max-width: 720px) {
    main { padding-top: 22px; }
    .panes { grid-template-columns: 1fr; }
    textarea { min-height: 200px; }
    .spacer { display: none; }
    .toolbar .btn { flex: 1 1 auto; justify-content: center; }
    .toolbar .btn-primary { flex-basis: 100%; }
    .band-btn .lang-name { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/*
 * CONVERSION TESTS
 * Each line is: [options] "input" => "expected", written as JSON strings.
 * Options: [umlauts] expands German umlauts, [ss=s] turns sharp s into s.
 * Lines without options use the defaults (umlauts off, sharp s to ss).
 *
 * TEST "Ștefan Țăndărică, Łódź, Søren, Müller, Æthel" => "Stefan Tandarica, Lodz, Soren, Muller, AEthel"
 * TEST "ș Ș ț Ț" => "s S t T"
 * TEST "ş Ş ţ Ţ" => "s S t T"
 * TEST "ă Ă â Â î Î" => "a A a A i I"
 * TEST "Şcoala din Ţăndărei, strada Ștefan cel Mare" => "Scoala din Tandarei, strada Stefan cel Mare"
 * TEST "ŞTEFĂNEŞTI, ȚĂRIȘOARA" => "STEFANESTI, TARISOARA"
 * TEST "ł Ł Wałęsa, Łukasz" => "l L Walesa, Lukasz"
 * TEST "ø Ø Bjørn Ødegaard" => "o O Bjorn Odegaard"
 * TEST "đ Đ Đorđević" => "d D Dordevic"
 * TEST "ß Straße" => "ss Strasse"
 * TEST [ss=s] "ß Straße" => "s Strase"
 * TEST "æ Æ œ Œ Cœur" => "ae AE oe OE Coeur"
 * TEST "ð Ð þ Þ Þórunn Guðmundsdóttir" => "d D th TH THorunn Gudmundsdottir"
 * TEST "ı İ İstanbul, Diyarbakır" => "i I Istanbul, Diyarbakir"
 * TEST "å Å Ålesund" => "a A Alesund"
 * TEST "Müller Äpfel Öl über" => "Muller Apfel Ol uber"
 * TEST [umlauts] "Müller Äpfel Öl über" => "Mueller AEpfel OEl ueber"
 * TEST [umlauts] "Mu\u0308ller" => "Mueller"
 * TEST "Mu\u0308ller, Jose\u0301" => "Muller, Jose"
 * TEST "\u2018single\u2019 \u201Cdouble\u201D \u201Eromanian\u201D \u00ABguillemets\u00BB" => "'single' \"double\" \"romanian\" \"guillemets\""
 * TEST "a\u2013b\u2014c\u2212d\u2011e" => "a-b-c-d-e"
 * TEST "Wait\u2026" => "Wait..."
 * TEST "a\u00A0b\u202Fc\u2009d\u200Be" => "a b c de"
 * TEST "\uFEFFName;City" => "Name;City"
 * TEST "ÉCOLE, Ñandú, Çelik, Dvořák" => "ECOLE, Nandu, Celik, Dvorak"
 * TEST "Line 1\r\nLine 2\tTab, 100 RON" => "Line 1\r\nLine 2\tTab, 100 RON"
 * TEST "Price 5 \u20AC" => "Price 5 \u20AC"
 */

/* CORE START */
var CHAR_MAP = {
  // Romanian: correct comma-below letters
  'ș': 's', 'Ș': 'S', 'ț': 't', 'Ț': 'T',
  // Romanian: legacy cedilla letters, still common in old documents
  'ş': 's', 'Ş': 'S', 'ţ': 't', 'Ţ': 'T',
  'ă': 'a', 'Ă': 'A', 'â': 'a', 'Â': 'A', 'î': 'i', 'Î': 'I',
  // Letters that NFD does not decompose
  'ł': 'l', 'Ł': 'L',
  'ø': 'o', 'Ø': 'O',
  'đ': 'd', 'Đ': 'D',
  'æ': 'ae', 'Æ': 'AE', 'œ': 'oe', 'Œ': 'OE',
  'ð': 'd', 'Ð': 'D', 'þ': 'th', 'Þ': 'TH',
  'ı': 'i', 'İ': 'I',
  'å': 'a', 'Å': 'A',
  'ħ': 'h', 'Ħ': 'H', 'ŧ': 't', 'Ŧ': 'T', 'ŀ': 'l', 'Ŀ': 'L',
  'ĳ': 'ij', 'Ĳ': 'IJ', 'ﬁ': 'fi', 'ﬂ': 'fl',
  // Quotes
  '\u2018': "'", '\u2019': "'", '\u201A': "'", '\u201B': "'",
  '\u2032': "'", '\u2039': "'", '\u203A': "'", '\u00B4': "'",
  '\u201C': '"', '\u201D': '"', '\u201E': '"', '\u201F': '"',
  '\u2033': '"', '\u00AB': '"', '\u00BB': '"',
  // Hyphens, dashes and minus
  '\u2010': '-', '\u2011': '-', '\u2012': '-', '\u2013': '-',
  '\u2014': '-', '\u2015': '-', '\u2212': '-',
  // Ellipsis
  '\u2026': '...',
  // Spaces that look normal but are not
  '\u00A0': ' ', '\u2000': ' ', '\u2001': ' ', '\u2002': ' ', '\u2003': ' ',
  '\u2004': ' ', '\u2005': ' ', '\u2006': ' ', '\u2007': ' ', '\u2008': ' ',
  '\u2009': ' ', '\u200A': ' ', '\u202F': ' ', '\u205F': ' ', '\u3000': ' ',
  // Invisible characters, removed entirely
  '\u200B': '', '\u200C': '', '\u200D': '', '\u2060': '', '\uFEFF': '', '\u00AD': ''
};

var UMLAUT_MAP = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'Ä': 'AE', 'Ö': 'OE', 'Ü': 'UE' };
var COMBINING_MARKS = /\p{M}/gu;
var ASCII_ONLY = /^[\x00-\x7F]*$/;

// Returns the cleaned text plus what was replaced and what had to be left alone.
// changes and kept are Maps keyed by the original character.
function cleanText(input, opts) {
  opts = opts || {};
  var text = String(input).normalize('NFC');
  var parts = [];
  var changes = new Map();
  var kept = new Map();

  for (var ch of text) {
    if (ch.charCodeAt(0) < 128) { parts.push(ch); continue; }

    var rep;
    if (opts.umlauts && UMLAUT_MAP[ch] !== undefined) {
      rep = UMLAUT_MAP[ch];
    } else if (ch === 'ß' || ch === 'ẞ') {
      var single = opts.sharpS === 's';
      rep = ch === 'ß' ? (single ? 's' : 'ss') : (single ? 'S' : 'SS');
    } else if (CHAR_MAP[ch] !== undefined) {
      rep = CHAR_MAP[ch];
    } else {
      rep = ch.normalize('NFD').replace(COMBINING_MARKS, '');
      if (!ASCII_ONLY.test(rep)) {
        kept.set(ch, (kept.get(ch) || 0) + 1);
        parts.push(ch);
        continue;
      }
    }

    parts.push(rep);
    var entry = changes.get(ch);
    if (entry) entry.count++;
    else changes.set(ch, { to: rep, count: 1 });
  }

  return { text: parts.join(''), changes: changes, kept: kept };
}
/* CORE END */

(function () {
  var I18N = {
    en: {
      langName: 'English',
      langAria: 'Change language to Romanian',

    ro: {

      paste: 'Lipește',
      upload: 'Încarcă .txt sau .csv',
      download: 'Descarcă',
      clear: 'Șterge',
      copy: 'Copiază rezultatul',
      copied: 'Copiat',
      umlauts: 'Extinde umlauturile germane (ä în ae)',
      sharpS: 'ß devine',
      inputLabel: 'Textul tău',
      outputLabel: 'Text curățat',
      private: 'Nimic nu părăsește dispozitivul',
      inputPlaceholder: 'Lipește sau scrie textul aici...',
      outputPlaceholder: 'Textul curățat apare aici pe măsură ce scrii.',
      shortcut: '{key} + Enter copiază',
      statIn: 'caractere la intrare',
      statOut: 'la ieșire',
      statChanged: 'modificate',
      replacedTitle: 'Caractere înlocuite',
      none: 'Nimic înlocuit încă.',
      keptTitle: 'Lăsate neschimbate, fără echivalent simplu',
      removed: 'eliminat',
      space: 'spațiu',
      pasteBlocked: 'Accesul la clipboard a fost blocat. Dă clic în panoul din stânga și apasă {key} + V.',
      copyBlocked: 'Copierea a fost blocată. Selectează rezultatul și apasă {key} + C.',
      nothingToCopy: 'Nu există încă nimic de copiat.',
      nothingToSave: 'Nu există încă nimic de descărcat.',
      saved: 'Salvat: {name}',
      fileError: 'Fișierul nu a putut fi citit.',
      fileType: 'Alege un fișier .txt sau .csv.',
      themeToLight: 'Comută la tema deschisă',
      themeToDark: 'Comută la tema întunecată',
      developedBy: 'Dezvoltat de',
      names: {
        '\u00A0': 'spațiu indivizibil', '\u202F': 'spațiu îngust indivizibil', '\u2009': 'spațiu subțire',
        '\u200B': 'spațiu de lățime zero', '\u200C': 'separator invizibil', '\u200D': 'legătură invizibilă',
        '\u2060': 'legătură de cuvânt', '\uFEFF': 'marcaj BOM', '\u00AD': 'cratimă discretă',
        '\u2011': 'cratimă indivizibilă', '\u2212': 'semnul minus', '\u2013': 'linie de pauză scurtă', '\u2014': 'linie de pauză lungă'
      },
      otherSpace: 'spațiu special'
    }
  };

  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var input = $('input'), output = $('output');
  var copyBtn = $('copyBtn'), copyLabel = $('copyLabel');
  var umlautToggle = $('umlautToggle'), fileInput = $('fileInput');
  var statusEl = $('status');
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  var modKey = isMac ? 'Cmd' : 'Ctrl';
  var lang = root.getAttribute('lang') === 'ro' ? 'ro' : 'en';
  var lastFileName = null;
  var copiedTimer = null, statusTimer = null, renderTimer = null;

  function t(key, vars) {
    var s = I18N[lang][key];
    if (vars) for (var k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
  }
  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function readStore(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  function showStatus(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.textContent = ''; }, 5000);
  }

  // Language
  function applyLang() {
    root.setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    input.placeholder = t('inputPlaceholder');
    output.placeholder = t('outputPlaceholder');
    $('shortcutHint').textContent = t('shortcut', { key: modKey });
    $('langName').textContent = t('langName');
    $('langBtn').setAttribute('aria-label', t('langAria'));
    if (copiedTimer) copyLabel.textContent = t('copied');
    applyThemeLabel();
    render();
  }
  $('langBtn').addEventListener('click', function () {
    lang = lang === 'en' ? 'ro' : 'en';
    store('dr-lang', lang);
    applyLang();
  });

  // Theme
  function applyThemeLabel() {
    var dark = root.getAttribute('data-theme') === 'dark';
    $('iconSun').style.display = dark ? '' : 'none';
    $('iconMoon').style.display = dark ? 'none' : '';
    var label = dark ? t('themeToLight') : t('themeToDark');
    $('themeBtn').setAttribute('aria-label', label);
    $('themeBtn').title = label;
  }
  function setTheme(theme, remember) {
    root.setAttribute('data-theme', theme);
    if (remember) store('dr-theme', theme);
    applyThemeLabel();
  }
  $('themeBtn').addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: light)');
    var onSystem = function (e) { if (!readStore('dr-theme')) setTheme(e.matches ? 'light' : 'dark', false); };
    if (mq.addEventListener) mq.addEventListener('change', onSystem);
  }

  // Conversion and report
  function options() {
    var ss = document.querySelector('input[name="sharpS"]:checked');
    return { umlauts: umlautToggle.checked, sharpS: ss ? ss.value : 'ss' };
  }

  function charCount(s) {
    var n = 0;
    for (var _ of s) n++;
    return n;
  }

  function displayChar(ch) {
    var names = I18N[lang].names;
    if (/^\p{M}$/u.test(ch)) return { glyph: '\u25CC' + ch, name: null };
    if (names[ch]) return { glyph: /\s|[\u200B-\u200D\u2060\uFEFF\u00AD]/.test(ch) ? null : ch, name: names[ch] };
    if (/\s/.test(ch)) return { glyph: null, name: t('otherSpace') };
    return { glyph: ch, name: null };
  }

  function codePoint(ch) {
    return 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
  }

  function chip(ch, to, count) {
    var li = document.createElement('li');
    li.className = 'chip';
    li.title = codePoint(ch);
    var d = displayChar(ch);
    if (d.glyph) { var g = document.createElement('span'); g.className = 'from'; g.textContent = d.glyph; li.appendChild(g); }
    if (d.name) { var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = d.name; li.appendChild(nm); }
    if (to !== null) {
      var a = document.createElement('span'); a.className = 'arrow'; a.textContent = '\u2192'; li.appendChild(a);
      var r = document.createElement('span');
      if (to === '') { r.className = 'name'; r.textContent = t('removed'); }
      else if (to === ' ') { r.className = 'name'; r.textContent = t('space'); }
      else { r.className = 'to'; r.textContent = to; }
      li.appendChild(r);
    }
    var n = document.createElement('span'); n.className = 'n'; n.textContent = '\u00D7' + count; li.appendChild(n);
    return li;
  }

  function render() {
    var src = input.value;
    var res = cleanText(src, options());
    if (output.value !== res.text) output.value = res.text;

    var nf = new Intl.NumberFormat(lang === 'ro' ? 'ro-RO' : 'en-US');
    var changed = 0;
    res.changes.forEach(function (v) { changed += v.count; });
    var stats = $('stats');
    stats.textContent = '';
    [[charCount(src), t('statIn')], [charCount(res.text), t('statOut')], [changed, t('statChanged')]].forEach(function (p, i) {
      if (i) { var dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '\u00B7'; stats.appendChild(dot); }
      var b = document.createElement('b'); b.textContent = nf.format(p[0]);
      stats.appendChild(b);
      stats.appendChild(document.createTextNode(' ' + p[1]));
    });

    var list = $('changeList');
    list.textContent = '';
    Array.from(res.changes.entries())
      .sort(function (a, b) { return b[1].count - a[1].count || a[0].localeCompare(b[0]); })
      .forEach(function (e) { list.appendChild(chip(e[0], e[1].to, e[1].count)); });
    $('changeEmpty').hidden = res.changes.size > 0;

    var keptList = $('keptList');
    keptList.textContent = '';
    Array.from(res.kept.entries())
      .sort(function (a, b) { return b[1] - a[1]; })
      .forEach(function (e) { keptList.appendChild(chip(e[0], null, e[1])); });
    $('keptBlock').hidden = res.kept.size === 0;
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    if (input.value.length > 200000) renderTimer = setTimeout(render, 150);
    else render();
  }

  input.addEventListener('input', scheduleRender);
  umlautToggle.addEventListener('change', render);
  document.querySelectorAll('input[name="sharpS"]').forEach(function (r) { r.addEventListener('change', render); });

  // Copy
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function markCopied() {
    copyLabel.textContent = t('copied');
    copyBtn.classList.add('is-done');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(function () {
      copiedTimer = null;
      copyLabel.textContent = t('copy');
      copyBtn.classList.remove('is-done');
    }, 2000);
  }
  function copyResult() {
    var text = output.value;
    if (!text) { showStatus(t('nothingToCopy')); return; }
    var fail = function () { if (fallbackCopy(text)) markCopied(); else showStatus(t('copyBlocked', { key: modKey })); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(markCopied, fail);
    else fail();
  }
  copyBtn.addEventListener('click', copyResult);

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); copyResult(); }
  });

  // Paste
  $('pasteBtn').addEventListener('click', function () {
    var blocked = function () { input.focus(); showStatus(t('pasteBlocked', { key: modKey })); };
    if (!navigator.clipboard || !navigator.clipboard.readText) { blocked(); return; }
    navigator.clipboard.readText().then(function (text) {
      input.value = text;
      input.focus();
      render();
    }, blocked);
  });

  // Clear
  $('clearBtn').addEventListener('click', function () {
    input.value = '';
    lastFileName = null;
    render();
    input.focus();
  });

  // Files: decode as UTF-8, fall back to Windows-1250 for old Central European exports
  function decode(buffer) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
    catch (e) { return new TextDecoder('windows-1250').decode(buffer); }
  }
  function downloadText(text, name) {
    var type = /\.csv$/i.test(name) ? 'text/csv' : 'text/plain';
    var url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showStatus(t('saved', { name: name }));
  }
  $('uploadBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (!/\.(txt|csv)$/i.test(file.name)) { showStatus(t('fileType')); return; }
    file.arrayBuffer().then(function (buf) {
      input.value = decode(buf);
      lastFileName = file.name;
      render();
      downloadText(output.value, file.name);
    }, function () { showStatus(t('fileError')); });
  });
  $('downloadBtn').addEventListener('click', function () {
    if (!output.value) { showStatus(t('nothingToSave')); return; }
    downloadText(output.value, lastFileName || 'clean-text.txt');
  });

  $('year').textContent = String(new Date().getFullYear());
  applyLang();
})();
