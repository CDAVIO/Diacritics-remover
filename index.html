<script>
  // Set theme and language before first paint, so there is no flash.
  (function () {
    var d = document.documentElement, t = null, l = null;
    try { t = localStorage.getItem('dr-theme'); l = localStorage.getItem('dr-lang'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (l !== 'en' && l !== 'ro') l = /^ro\b/i.test(navigator.language || '') ? 'ro' : 'en';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
  })();
</script>

<style>
  :root {
    --yellow: #FFD905;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mark: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0c;
    --surface: rgba(24, 24, 24, 0.78);
    --surface-solid: #181818;
    --field: #121212;
    --field-out: #15140c;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.2);
    --text: #ffffff;
    --muted: #9d9d9d;
    --accent: #FFD905;
    --on-accent: #111111;
    --accent-ink: #FFD905;
    --glow: rgba(255, 217, 5, 0.16);
    --dots: rgba(255, 255, 255, 0.07);
    --focus: #FFD905;
    --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f7f6f1;
    --surface: rgba(255, 255, 255, 0.82);
    --surface-solid: #ffffff;
    --field: #ffffff;
    --field-out: #fffbe6;
    --border: rgba(17, 17, 17, 0.1);
    --border-strong: rgba(17, 17, 17, 0.24);
    --text: #111111;
    --muted: #5d5d57;
    --accent: #FFD905;
    --on-accent: #111111;
    --accent-ink: #7a6400;
    --glow: rgba(255, 217, 5, 0.32);
    --dots: rgba(17, 17, 17, 0.07);
    --focus: #111111;
    --shadow: 0 30px 70px -35px rgba(60, 50, 0, 0.35), 0 0 0 1px rgba(17, 17, 17, 0.02);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    position: relative;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font-ui);
    overflow-x: hidden;
  }
  /* Glow and dot grid behind everything */
  body::before, body::after { content: ""; position: absolute; inset: 0 0 auto 0; pointer-events: none; z-index: 0; }
  body::before {
    height: 900px;
    background-image: radial-gradient(var(--dots) 1px, transparent 1.4px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 75%);
  }
  body::after {
    height: 760px;
    background: radial-gradient(ellipse 55% 55% at 50% 0%, var(--glow), transparent 70%);
    animation: breathe 9s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { opacity: 0.65; } to { opacity: 1; } }
  body > * { position: relative; z-index: 1; }

  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; }
  .wordmark {
    font-family: var(--font-mark);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }
  .wordmark .io { color: var(--yellow); }
  :root[data-theme="light"] .wordmark .io { text-shadow: 0 0 0.5px rgba(0, 0, 0, 0.25); }
  .bar-actions { display: flex; align-items: center; gap: 8px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .pill-btn:hover { border-color: var(--border-strong); }
  .pill-btn svg { width: 18px; height: 18px; flex: none; }
  .icon-only { width: 40px; padding: 0; justify-content: center; }

  /* Hero */
  .hero { text-align: center; padding: 28px 0 8px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .eyebrow img { width: 26px; height: 26px; border-radius: 8px; display: block; }
  .eyebrow b { color: var(--text); }
  .stage {
    height: clamp(96px, 20vw, 180px);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    margin: 22px 0 0;
  }
  .word {
    --len: 6;
    font-family: var(--font-mark);
    font-weight: 800;
    font-size: clamp(40px, calc(86vw / (var(--len) * 0.68)), 136px);
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .word .l { display: inline-block; opacity: 0; transform: translateY(0.35em); filter: blur(8px); }
  .word.in .l {
    animation: rise 0.55s cubic-bezier(.2, .8, .2, 1) forwards;
    animation-delay: calc(var(--i) * 45ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
  .word .hit { display: inline-grid; }
  .word .hit > span { grid-area: 1 / 1; text-align: center; transition: opacity .45s ease, transform .55s cubic-bezier(.2, .8, .2, 1), filter .45s ease, color .3s ease; }
  .word .hit .o { color: var(--accent); text-shadow: 0 0 28px rgba(255, 217, 5, 0.45); }
  :root[data-theme="light"] .word .hit .o { color: var(--yellow); -webkit-text-stroke: 2px #111; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(200, 160, 0, 0.35); }
  .word .hit .p { opacity: 0; transform: translateY(0.3em); }
  .word.clean .hit .o { opacity: 0; transform: translateY(-0.55em) rotate(-8deg) scale(0.85); filter: blur(8px); }
  .word.clean .hit .p { opacity: 1; transform: none; }
  .word.out .l { opacity: 0 !important; transform: translateY(-0.25em); filter: blur(6px); transition: all .35s ease; animation: none; }
  .caption {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 6px 0 0; min-height: 28px;
    font-family: var(--font-mono); font-size: 15px; color: var(--muted);
  }
  .caption .from { color: var(--text); }
  .caption .arrow { color: var(--accent-ink); font-weight: 700; }
  .caption .to { color: var(--text); padding: 1px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); }
  h1 { margin: 22px auto 8px; max-width: 18ch; font-family: var(--font-mark); font-size: clamp(28px, 4.6vw, 46px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 800; }
  h1 .hl { background: linear-gradient(transparent 60%, var(--glow) 60%); }
  :root[data-theme="dark"] h1 .hl { color: var(--accent); background: none; }
  .lede { margin: 0 auto; color: var(--muted); max-width: 62ch; }
  .lede strong { color: var(--text); font-weight: 600; }

  /* Tool card */
  .card {
    position: relative;
    margin: 34px 0 0;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .card::before {
    content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--yellow), transparent);
    opacity: 0.8;
  }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 42px; padding: 0 14px;
    background: var(--surface-solid); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
    transition: border-color .15s, transform .15s;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 17px; height: 17px; flex: none; }
  .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: 0 8px 24px -10px rgba(255, 217, 5, 0.7); }
  .btn-primary:hover { border-color: var(--accent); filter: brightness(0.97); }
  .btn-primary.is-done { background: var(--text); color: var(--bg); border-color: var(--text); box-shadow: none; }
  .spacer { flex: 1; }
  .tip { margin: 12px 2px 14px; font-size: 13px; color: var(--muted); }
  .tip kbd {
    font-family: var(--font-mono); font-size: 12px;
    padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px;
    color: var(--text);
  }

  .panes { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 8px; }
  .pane-head label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .pane-head .hint { font-size: 12px; color: var(--muted); }
  .flow { display: flex; align-items: center; justify-content: center; padding-top: 26px; }
  .flow span {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    box-shadow: 0 0 0 6px var(--glow);
  }
  .flow svg { width: 20px; height: 20px; }
  textarea {
    width: 100%; min-height: 320px; flex: 1; resize: vertical;
    padding: 14px 16px;
    background: var(--field); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 16px; line-height: 1.55;
    overflow-wrap: anywhere;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea::placeholder { color: var(--muted); opacity: 0.85; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  #output { background: var(--field-out); }
  #input.drag { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  #output.flash { animation: flash .6s ease; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255, 217, 5, 0.6); } 100% { box-shadow: 0 0 0 14px rgba(255, 217, 5, 0); } }

  .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; margin: 14px 2px 0; }
  .stats { margin: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .dot { margin: 0 8px; opacity: 0.6; }
  .status { margin: 0; min-height: 1.5em; font-size: 14px; font-weight: 600; color: var(--accent-ink); }

  .changes { margin-top: 6px; }
  .changes h2 { margin: 14px 2px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; font-size: 13px;
    background: var(--surface-solid); border: 1px solid var(--border); border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .chip .from, .chip .to { font-family: var(--font-mono); font-weight: 600; }
  .chip .to { color: var(--accent-ink); }
  .chip .name { font-weight: 500; font-size: 12px; color: var(--muted); }
  .chip .arrow, .chip .n { color: var(--muted); }
  .empty { margin: 0 2px; font-size: 14px; color: var(--muted); }

  /* Footer */
  footer { padding: 56px 0 40px; text-align: center; }
  .socials { display: flex; justify-content: center; gap: 16px; margin-bottom: 26px; }
  .socials a {
    display: grid; place-items: center; width: 56px; height: 56px;
    border: 1px solid var(--border-strong); border-radius: 50%;
    color: var(--text); transition: border-color .15s, color .15s, transform .15s;
  }
  .socials a:hover { border-color: var(--accent); transform: translateY(-2px); }
  .socials svg { width: 24px; height: 24px; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; margin: 0 0 22px; padding: 0; list-style: none; font-size: 16px; }
  .links a { text-decoration: none; border-bottom: 1px solid var(--border-strong); padding-bottom: 2px; }
  .links a:hover { border-color: var(--accent); }
  .dev { margin: 0 0 8px; font-family: var(--font-mark); font-weight: 800; font-size: 18px; color: var(--muted); }
  .dev .wordmark { font-size: 18px; border-bottom: 1px solid var(--border-strong); padding-bottom: 2px; }
  .copy { margin: 0; font-size: 14px; color: var(--muted); }

  @media (max-width: 760px) {
    .hero { padding-top: 14px; }
    .card { padding: 14px; border-radius: 18px; margin-top: 26px; }
    .panes { grid-template-columns: minmax(0, 1fr); }
    .flow { padding: 0; }
    .flow svg { transform: rotate(90deg); }
    textarea { min-height: 180px; }
    .spacer { display: none; }
    .toolbar .btn { flex: 1 1 auto; justify-content: center; }
    .toolbar .btn-primary { flex-basis: 100%; order: -1; }
    .socials a { width: 50px; height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<main>

// Returns the cleaned text plus what was replaced and what had to be left alone.
// changes and kept are Maps keyed by the original character.
function cleanText(input, opts) {
  opts = opts || {};
  var text = String(input).normalize('NFC');
  var parts = [];
  var changes = new Map();
  var kept = new Map();

  for (var ch of text) {
    if (ch.charCodeAt(0) < 128) { parts.push(ch); continue; }

    var rep;
    if (opts.umlauts && UMLAUT_MAP[ch] !== undefined) {
      rep = UMLAUT_MAP[ch];
    } else if (ch === 'ß' || ch === 'ẞ') {
      var single = opts.sharpS === 's';
      rep = ch === 'ß' ? (single ? 's' : 'ss') : (single ? 'S' : 'SS');
    } else if (CHAR_MAP[ch] !== undefined) {
      rep = CHAR_MAP[ch];
    } else {
      rep = ch.normalize('NFD').replace(COMBINING_MARKS, '');
      if (!ASCII_ONLY.test(rep)) {

        parts.push(ch);
        continue;
      }
    }

    parts.push(rep);
    var entry = changes.get(ch);
    if (entry) entry.count++;
    else changes.set(ch, { to: rep, count: 1 });
  }

  return { text: parts.join(''), changes: changes, kept: kept };
}

    if (/^\p{M}$/u.test(ch)) return { glyph: '\u25CC' + ch, name: null };
    if (names[ch]) return { glyph: /\s|[\u200B-\u200D\u2060\uFEFF\u00AD]/.test(ch) ? null : ch, name: names[ch] };
    if (/\s/.test(ch)) return { glyph: null, name: t('otherSpace') };
    return { glyph: ch, name: null };
  }

  function codePoint(ch) {
    return 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
  }

  function chip(ch, to, count) {
    var li = document.createElement('li');
    li.className = 'chip';
    li.title = codePoint(ch);
    var d = displayChar(ch);
    if (d.glyph) { var g = document.createElement('span'); g.className = 'from'; g.textContent = d.glyph; li.appendChild(g); }
    if (d.name) { var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = d.name; li.appendChild(nm); }
    if (to !== null) {
      var a = document.createElement('span'); a.className = 'arrow'; a.textContent = '\u2192'; li.appendChild(a);
      var r = document.createElement('span');
      if (to === '') { r.className = 'name'; r.textContent = t('removed'); }
      else if (to === ' ') { r.className = 'name'; r.textContent = t('space'); }
      else { r.className = 'to'; r.textContent = to; }
      li.appendChild(r);
    }
    var n = document.createElement('span'); n.className = 'n'; n.textContent = '\u00D7' + count; li.appendChild(n);
    return li;
  }

  function render() {
    var src = input.value;
    var res = cleanText(src);
    if (output.value !== res.text) output.value = res.text;

    var nf = new Intl.NumberFormat(lang === 'ro' ? 'ro-RO' : 'en-US');
    var changed = 0;
    res.changes.forEach(function (v) { changed += v.count; });
    var stats = $('stats');
    stats.textContent = '';
    [[charCount(src), t('statIn')], [charCount(res.text), t('statOut')], [changed, t('statChanged')]].forEach(function (p, i) {
      if (i) { var dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '\u00B7'; stats.appendChild(dot); }
      var b = document.createElement('b'); b.textContent = nf.format(p[0]);
      stats.appendChild(b);
      stats.appendChild(document.createTextNode(' ' + p[1]));
    });

    var list = $('changeList');
    list.textContent = '';
    Array.from(res.changes.entries())
      .sort(function (a, b) { return b[1].count - a[1].count || a[0].localeCompare(b[0]); })
      .forEach(function (e) { list.appendChild(chip(e[0], e[1].to, e[1].count)); });
    $('changeEmpty').hidden = res.changes.size > 0;

    var keptList = $('keptList');
    keptList.textContent = '';
    Array.from(res.kept.entries())
      .sort(function (a, b) { return b[1] - a[1]; })
      .forEach(function (e) { keptList.appendChild(chip(e[0], null, e[1])); });
    $('keptBlock').hidden = res.kept.size === 0;
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    if (input.value.length > 200000) renderTimer = setTimeout(render, 150);
    else render();
  }
  input.addEventListener('input', scheduleRender);

  // Copy
  function fallbackCopy(text) {
    var active = document.activeElement;
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (active && active.focus) active.focus();
    return ok;
  }
  function markCopied() {
    copyLabel.textContent = t('copied');
    copyBtn.classList.add('is-done');
    output.classList.remove('flash'); void output.offsetWidth; output.classList.add('flash');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(function () {
      copiedTimer = null;
      copyLabel.textContent = t('copy');
      copyBtn.classList.remove('is-done');
    }, 2000);
  }
  function copyResult(auto) {
    var text = output.value;
    if (!text) { if (!auto) showStatus(t('nothingToCopy')); return; }
    var done = function () { markCopied(); if (auto) showStatus(t('autoCopied')); };
    var fail = function () { if (fallbackCopy(text)) done(); else showStatus(t('copyBlocked', { key: modKey })); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }
  copyBtn.addEventListener('click', function () { copyResult(false); });

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); copyResult(false); }
  });

  // Paste anywhere: the text is cleaned and copied straight away
  document.addEventListener('paste', function (e) {
    if (e.target === input) {
      setTimeout(function () { render(); copyResult(true); }, 0);
      return;
    }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var text = e.clipboardData && e.clipboardData.getData('text/plain');
    if (!text) return;
    e.preventDefault();
    input.value = text;
    render();
    copyResult(true);
  });
  $('pasteBtn').addEventListener('click', function () {
    var blocked = function () { input.focus(); showStatus(t('pasteBlocked', { key: modKey })); };
    if (!navigator.clipboard || !navigator.clipboard.readText) { blocked(); return; }
    navigator.clipboard.readText().then(function (text) {
      input.value = text;
      render();
      copyResult(true);
    }, blocked);
  });

  // Clear
  $('clearBtn').addEventListener('click', function () {
    input.value = '';
    lastFileName = null;
    render();
    input.focus();
  });

  // Files: decode as UTF-8, fall back to Windows-1250 for old Central European exports
  function decode(buffer) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
    catch (e) { return new TextDecoder('windows-1250').decode(buffer); }
  }
  function downloadText(text, name) {
    var type = /\.csv$/i.test(name) ? 'text/csv' : 'text/plain';
    var url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showStatus(t('saved', { name: name }));
  }
  function handleFile(file) {
    if (!file) return;
    if (!/\.(txt|csv)$/i.test(file.name)) { showStatus(t('fileType')); return; }
    file.arrayBuffer().then(function (buf) {
      input.value = decode(buf);
      lastFileName = file.name;
      render();
      downloadText(output.value, file.name);
    }, function () { showStatus(t('fileError')); });
  }
  $('uploadBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    handleFile(file);
  });
  input.addEventListener('dragover', function (e) {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).indexOf('Files') > -1) { e.preventDefault(); input.classList.add('drag'); }
  });
  input.addEventListener('dragleave', function () { input.classList.remove('drag'); });
  input.addEventListener('drop', function (e) {
    input.classList.remove('drag');
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    e.preventDefault();
    handleFile(file);
  });
  $('downloadBtn').addEventListener('click', function () {
    if (!output.value) { showStatus(t('nothingToSave')); return; }
    downloadText(output.value, lastFileName || 'clean-text.txt');
  });

  $('year').textContent = String(new Date().getFullYear());
  applyLang();
})();
</script>
</body>
</html>
