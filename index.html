<script>
  // Set theme and language before first paint, so there is no flash.
  (function () {
    var d = document.documentElement, t = null, l = null;
    try { t = localStorage.getItem('dr-theme'); l = localStorage.getItem('dr-lang'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'dark';
    if (l !== 'en' && l !== 'ro') l = /^ro\b/i.test(navigator.language || '') ? 'ro' : 'en';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
  })();
</script>

<script>
/*
 * CONVERSION TESTS
 * Each line is: [options] "input" => "expected", written as JSON strings.
 * Options: [umlauts] expands German umlauts, [ss=s] turns sharp s into s.
 * Lines without options use the defaults (umlauts off, sharp s to ss), which is what the page uses.
 *
 * TEST "Ștefan Țăndărică, Łódź, Søren, Müller, Æthel" => "Stefan Tandarica, Lodz, Soren, Muller, AEthel"
 * TEST "Bună" => "Buna"
 * TEST "ș Ș ț Ț" => "s S t T"
 * TEST "ş Ş ţ Ţ" => "s S t T"
 * TEST "ă Ă â Â î Î" => "a A a A i I"
 * TEST "Şcoala din Ţăndărei, strada Ștefan cel Mare" => "Scoala din Tandarei, strada Stefan cel Mare"
 * TEST "ŞTEFĂNEŞTI, ȚĂRIȘOARA" => "STEFANESTI, TARISOARA"
 * TEST "ł Ł Wałęsa, Łukasz" => "l L Walesa, Lukasz"
 * TEST "ø Ø Bjørn Ødegaard" => "o O Bjorn Odegaard"
 * TEST "đ Đ Đorđević" => "d D Dordevic"
 * TEST "ß Straße" => "ss Strasse"
 * TEST [ss=s] "ß Straße" => "s Strase"
 * TEST "æ Æ œ Œ Cœur" => "ae AE oe OE Coeur"
 * TEST "ð Ð þ Þ Þórunn Guðmundsdóttir" => "d D th TH THorunn Gudmundsdottir"
 * TEST "ı İ İstanbul, Diyarbakır" => "i I Istanbul, Diyarbakir"
 * TEST "å Å Ålesund" => "a A Alesund"
 * TEST "Müller Äpfel Öl über" => "Muller Apfel Ol uber"
 * TEST [umlauts] "Müller Äpfel Öl über" => "Mueller AEpfel OEl ueber"
 * TEST [umlauts] "Mu\u0308ller" => "Mueller"
 * TEST "Mu\u0308ller, Jose\u0301" => "Muller, Jose"
 * TEST "\u2018single\u2019 \u201Cdouble\u201D \u201Eromanian\u201D \u00ABguillemets\u00BB" => "'single' \"double\" \"romanian\" \"guillemets\""
 * TEST "a\u2013b\u2014c\u2212d\u2011e" => "a-b-c-d-e"
 * TEST "Wait\u2026" => "Wait..."
 * TEST "a\u00A0b\u202Fc\u2009d\u200Be" => "a b c de"
 * TEST "\uFEFFName;City" => "Name;City"
 * TEST "ÉCOLE, Ñandú, Çelik, Dvořák" => "ECOLE, Nandu, Celik, Dvorak"
 * TEST "Line 1\r\nLine 2\tTab, 100 RON" => "Line 1\r\nLine 2\tTab, 100 RON"
 * TEST "Price 5 \u20AC" => "Price 5 \u20AC"
 */

/* CORE START */
var CHAR_MAP = {
  // Romanian: correct comma-below letters
  'ș': 's', 'Ș': 'S', 'ț': 't', 'Ț': 'T',
  // Romanian: legacy cedilla letters, still common in old documents
  'ş': 's', 'Ş': 'S', 'ţ': 't', 'Ţ': 'T',
  'ă': 'a', 'Ă': 'A', 'â': 'a', 'Â': 'A', 'î': 'i', 'Î': 'I',
  // Letters that NFD does not decompose
  'ł': 'l', 'Ł': 'L',
  'ø': 'o', 'Ø': 'O',
  'đ': 'd', 'Đ': 'D',
  'æ': 'ae', 'Æ': 'AE', 'œ': 'oe', 'Œ': 'OE',
  'ð': 'd', 'Ð': 'D', 'þ': 'th', 'Þ': 'TH',
  'ı': 'i', 'İ': 'I',
  'å': 'a', 'Å': 'A',
  'ħ': 'h', 'Ħ': 'H', 'ŧ': 't', 'Ŧ': 'T', 'ŀ': 'l', 'Ŀ': 'L',
  'ĳ': 'ij', 'Ĳ': 'IJ', 'ﬁ': 'fi', 'ﬂ': 'fl',
  // Quotes
  '\u2018': "'", '\u2019': "'", '\u201A': "'", '\u201B': "'",
  '\u2032': "'", '\u2039': "'", '\u203A': "'", '\u00B4': "'",
  '\u201C': '"', '\u201D': '"', '\u201E': '"', '\u201F': '"',
  '\u2033': '"', '\u00AB': '"', '\u00BB': '"',
  // Hyphens, dashes and minus
  '\u2010': '-', '\u2011': '-', '\u2012': '-', '\u2013': '-',
  '\u2014': '-', '\u2015': '-', '\u2212': '-',
  // Ellipsis
  '\u2026': '...',
  // Spaces that look normal but are not
  '\u00A0': ' ', '\u2000': ' ', '\u2001': ' ', '\u2002': ' ', '\u2003': ' ',
  '\u2004': ' ', '\u2005': ' ', '\u2006': ' ', '\u2007': ' ', '\u2008': ' ',
  '\u2009': ' ', '\u200A': ' ', '\u202F': ' ', '\u205F': ' ', '\u3000': ' ',
  // Invisible characters, removed entirely
  '\u200B': '', '\u200C': '', '\u200D': '', '\u2060': '', '\uFEFF': '', '\u00AD': ''
};

var UMLAUT_MAP = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'Ä': 'AE', 'Ö': 'OE', 'Ü': 'UE' };
var COMBINING_MARKS = /\p{M}/gu;
var ASCII_ONLY = /^[\x00-\x7F]*$/;

// Returns the cleaned text plus what was replaced and what had to be left alone.
// changes and kept are Maps keyed by the original character.
function cleanText(input, opts) {
  opts = opts || {};
  var text = String(input).normalize('NFC');
  var parts = [];
  var changes = new Map();
  var kept = new Map();

  for (var ch of text) {

    list.textContent = '';
    Array.from(res.changes.entries())
      .sort(function (a, b) { return b[1].count - a[1].count || a[0].localeCompare(b[0]); })
      .forEach(function (e) { list.appendChild(chip(e[0], e[1].to, e[1].count)); });
    $('changeEmpty').hidden = res.changes.size > 0;

    var keptList = $('keptList');
    keptList.textContent = '';
    Array.from(res.kept.entries())
      .sort(function (a, b) { return b[1] - a[1]; })
      .forEach(function (e) { keptList.appendChild(chip(e[0], null, e[1])); });
    $('keptBlock').hidden = res.kept.size === 0;
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    if (input.value.length > 200000) renderTimer = setTimeout(render, 150);
    else render();
  }
  input.addEventListener('input', scheduleRender);

  // Copy
  function fallbackCopy(text) {
    var active = document.activeElement;
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (active && active.focus) active.focus();
    return ok;
  }
  function markCopied() {
    copyLabel.textContent = t('copied');
    copyBtn.classList.add('is-done');
    output.classList.remove('flash'); void output.offsetWidth; output.classList.add('flash');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(function () {
      copiedTimer = null;
      copyLabel.textContent = t('copy');
      copyBtn.classList.remove('is-done');
    }, 2000);
  }
  function copyResult(auto) {
    var text = output.value;
    if (!text) { if (!auto) showStatus(t('nothingToCopy')); return; }
    var done = function () { markCopied(); if (auto) showStatus(t('autoCopied')); };
    var fail = function () { if (fallbackCopy(text)) done(); else showStatus(t('copyBlocked', { key: modKey })); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }
  copyBtn.addEventListener('click', function () { copyResult(false); });

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); copyResult(false); }
  });

  // Paste anywhere: the text is cleaned and copied straight away
  document.addEventListener('paste', function (e) {
    if (e.target === input) {
      setTimeout(function () { render(); copyResult(true); }, 0);
      return;
    }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var text = e.clipboardData && e.clipboardData.getData('text/plain');
    if (!text) return;
    e.preventDefault();
    input.value = text;
    render();
    copyResult(true);
  });
  $('pasteBtn').addEventListener('click', function () {
    var blocked = function () { input.focus(); showStatus(t('pasteBlocked', { key: modKey })); };
    if (!navigator.clipboard || !navigator.clipboard.readText) { blocked(); return; }
    navigator.clipboard.readText().then(function (text) {
      input.value = text;
      render();
      copyResult(true);
    }, blocked);
  });

  // Clear
  $('clearBtn').addEventListener('click', function () {
    input.value = '';
    lastFileName = null;
    render();
    input.focus();
  });

  // Files: decode as UTF-8, fall back to Windows-1250 for old Central European exports
  function decode(buffer) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
    catch (e) { return new TextDecoder('windows-1250').decode(buffer); }
  }
  function downloadText(text, name) {
    var type = /\.csv$/i.test(name) ? 'text/csv' : 'text/plain';
    var url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showStatus(t('saved', { name: name }));
  }
  function handleFile(file) {
    if (!file) return;
    if (!/\.(txt|csv)$/i.test(file.name)) { showStatus(t('fileType')); return; }
    file.arrayBuffer().then(function (buf) {
      input.value = decode(buf);
      lastFileName = file.name;
      render();
      downloadText(output.value, file.name);
    }, function () { showStatus(t('fileError')); });
  }
  $('uploadBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    handleFile(file);
  });
  input.addEventListener('dragover', function (e) {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).indexOf('Files') > -1) { e.preventDefault(); input.classList.add('drag'); }
  });
  input.addEventListener('dragleave', function () { input.classList.remove('drag'); });
  input.addEventListener('drop', function (e) {
    input.classList.remove('drag');
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    e.preventDefault();
    handleFile(file);
  });
  $('downloadBtn').addEventListener('click', function () {
    if (!output.value) { showStatus(t('nothingToSave')); return; }
    downloadText(output.value, lastFileName || 'clean-text.txt');
  });

  $('year').textContent = String(new Date().getFullYear());
  applyLang();
})();
</script>
</body>
</html>
