<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Page not found, CDAV.IO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='800' text-anchor='middle' fill='%23FFD905'%3Ea%3C/text%3E%3C/svg%3E">
<script>
  (function () {
    var d = document.documentElement, t = null, l = null;
    try { t = localStorage.getItem('dr-theme'); l = localStorage.getItem('dr-lang'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (l !== 'en' && l !== 'ro') l = /^ro\b/i.test(navigator.language || '') ? 'ro' : 'en';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
  })();
</script>
<style>
  :root {
    --brand-black: #111111;
    --brand-yellow: #FFD905;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mark: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] { --bg: #111111; --text: #ffffff; --muted: #a6a6a6; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f5f5f2; --text: #111111; --muted: #595954; color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text); font: 16px/1.5 var(--font-ui);
  }
  .band { background: var(--brand-black); color: #fff; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: center; min-height: 64px; }
  .wordmark { font-family: var(--font-mark); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; color: #fff; text-decoration: none; }
  .wordmark .io { color: var(--brand-yellow); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; text-align: center; }
  .code { margin: 0; font-family: var(--font-mark); font-weight: 800; font-size: 72px; line-height: 1; color: var(--text); }
  .code span { color: var(--brand-yellow); }
  :root[data-theme="light"] .code span { color: #111; text-decoration: underline; text-decoration-color: var(--brand-yellow); text-decoration-thickness: 8px; text-underline-offset: 6px; }
  p.line { margin: 16px 0 28px; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; height: 44px; padding: 0 20px;
    background: var(--brand-yellow); color: #111; border-radius: 10px;
    font-weight: 700; text-decoration: none;
  }
  .btn:hover { filter: brightness(0.95); }
  :focus-visible { outline: 2px solid var(--brand-yellow); outline-offset: 3px; }
  footer { padding: 22px 0; text-align: center; font-size: 14px; color: #cfcfcf; }
  footer .wordmark { font-size: 14px; }
  footer p { margin: 2px 0; }
  footer .small { font-size: 12px; color: #8f8f8f; }
</style>
</head>
<body>
<header class="band"><div class="wrap"><a class="wordmark" href="/">CDAV.<span class="io">IO</span></a></div></header>
<main>
  <div>
    <p class="code">4<span>0</span>4</p>
    <p class="line" id="line">This page does not exist.</p>
    <a class="btn" href="/" id="home">Back to Diacritics Remover</a>
  </div>
</main>
<footer class="band">
  <div class="wrap">
    <p><span id="dev">Developed by</span> <a class="wordmark" href="https://cdav.io" rel="noopener">CDAV.<span class="io">IO</span></a></p>
    <p class="small">&copy; <span id="year">2026</span> CDAV.IO</p>
  </div>
</footer>
<script>
  document.getElementById('year').textContent = String(new Date().getFullYear());
  if (document.documentElement.lang === 'ro') {
    document.title = 'Pagina nu a fost găsită, CDAV.IO';
    document.getElementById('line').textContent = 'Această pagină nu există.';
    document.getElementById('home').textContent = 'Înapoi la Diacritics Remover';
    document.getElementById('dev').textContent = 'Dezvoltat de';
  }
</script>
</body>
</html>
