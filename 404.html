<style>
  :root {
    --yellow: #FFD905;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mark: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] { --bg: #0c0c0c; --text: #ffffff; --muted: #9d9d9d; --glow: rgba(255, 217, 5, 0.16); --dots: rgba(255, 255, 255, 0.07); --focus: #FFD905; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f7f6f1; --text: #111111; --muted: #5d5d57; --glow: rgba(255, 217, 5, 0.32); --dots: rgba(17, 17, 17, 0.07); --focus: #111111; color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {

    background: var(--bg); color: var(--text); font: 16px/1.5 var(--font-ui); overflow-x: hidden;
  }
  body::before, body::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  body::before {
    background-image: radial-gradient(var(--dots) 1px, transparent 1.4px); background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 20%, transparent 70%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 20%, transparent 70%);
  }
  body::after { background: radial-gradient(ellipse 45% 40% at 50% 45%, var(--glow), transparent 70%); }
  body > * { position: relative; z-index: 1; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: center; min-height: 72px; }
  .wordmark { font-family: var(--font-mark); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; color: var(--text); text-decoration: none; }
  .wordmark .io { color: var(--yellow); }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { display: block; border-radius: 9px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; text-align: center; }
  .code { margin: 0; font-family: var(--font-mark); font-weight: 800; font-size: clamp(88px, 22vw, 160px); line-height: 1; letter-spacing: -0.03em; }
  .code span { color: var(--yellow); text-shadow: 0 0 40px rgba(255, 217, 5, 0.45); }
  :root[data-theme="light"] .code span { color: var(--text); text-shadow: none; background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 90%, transparent 90%); }
  p.line { margin: 18px 0 28px; color: var(--muted); font-size: 18px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px;
    background: var(--yellow); color: #111; border-radius: 12px;
    font-weight: 700; text-decoration: none; box-shadow: 0 10px 28px -12px rgba(255, 217, 5, 0.8);
  }
  .btn:hover { filter: brightness(0.97); }
  footer { padding: 28px 0 36px; text-align: center; }
  .dev { margin: 0 0 6px; font-family: var(--font-mark); font-weight: 800; font-size: 16px; color: var(--muted); }
  .copy { margin: 0; font-size: 13px; color: var(--muted); }
</style>
