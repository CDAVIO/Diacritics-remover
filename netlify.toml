# Publishes only the site files. There is no build: the command just copies them.
[build]
  command = "mkdir -p dist && cp index.html 404.html icon.svg preview.png robots.txt sitemap.xml dist/ && cp -R why-remove-diacritics de-ce-sa-elimini-diacriticele dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
